[Mode]
# RTK or SPP
IsRTKMode = 1

# 运行数据模式: 1 = 本地离线文件模式 (FILE), 0 = 实时网络/串口模式 (NET/COM)
IsFileData = 1

# 解算策略模式: 1 = 扩展卡尔曼滤波 (EKF), 2 = 最小二乘平差 (LSQ)
RTKProcMode = 2



[Serial]
# 串口号设置 (COM 模式使用)
RovPort = 1
# 波特率设置
RovBaud = 115200

[Network]
# 实时数据网络连接配置 (流动站与基站，实时网络模式使用)
BasNetIP = 47.114.134.129
BasNetPort = 7190
RovNetIP = 47.114.134.129
RovNetPort = 7190

[Files]
# 观测数据文件名 (离线文件模式使用，支持相对路径或绝对路径)
BasObsDatFile = ./data/oem719-202603111200.bin
RovObsDatFile = ./data/oem719-202603111200.bin

# 解算结果输出文件名
ResFile = ./result.txt

[Quality]
# 观测噪声设置 (单位: m)
CodeNoise = 0.3
CPNoise = 0.003

# 卫星截止高度角阈值 (单位: deg)
ElevThreshold = 10.0

# 模糊度 Ratio 检验阈值
RatioThres = 3.0
